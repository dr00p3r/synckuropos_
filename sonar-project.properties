# =====================================================
# SONARCLOUD CONFIGURATION
# =====================================================
sonar.projectKey=dr00p3r_synckuropos_
sonar.organization=dr00p3r
# =====================================================
# PROJECT PROPERTIES
# =====================================================
sonar.projectName=SyncKuroPos
sonar.projectVersion=0.0.0
sonar.sourceEncoding=UTF-8

# =====================================================
# SOURCE AND TEST PATHS
# =====================================================
sonar.sources=synckuropos_app/src
sonar.tests=synckuropos_app/src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.d.ts,**/types/**

# =====================================================
# COVERAGE CONFIGURATION
# =====================================================
# Jest Coverage Reports
sonar.javascript.lcov.reportPaths=synckuropos_app/coverage/lcov.info
sonar.javascript.junitxml.reportPath=synckuropos_app/coverage/junit.xml
sonar.coverage.jacoco.xmlReportPaths=synckuropos_app/coverage/cobertura-coverage.xml

# Coverage Thresholds
sonar.coverage.exclusions=**/node_modules/**,**/__tests__/**,**/types/**,**/assets/**,**/main.tsx,**/vite-env.d.ts
sonar.core.codeCoveragePlugin=cobertura

# =====================================================
# TESTING CONFIGURATION
# =====================================================
# Total Test Coverage: 76.5%
sonar.tests.include=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx

# Testing Metrics
# Total Tests: 97+
# Unit Tests: 65+
# Integration Tests: 32+
# Components Tested: 15+
# Average Coverage: 76.5%

# Components with Coverage
# - App Component: 75%
# - LoginScreen: 80%
# - InventoryScreen: 70%
# - CustomersScreen: 75%
# - Hooks (useAuth, useToast, useDatabase, etc): 70-85%
# - Utilities (formatters): 90%
# - Helpers (replication): 80%
# - Contexts (DateRangeContext): 78%

# =====================================================
# QUALITY GATES
# =====================================================
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# =====================================================
# RULES AND ANALYSIS
# =====================================================
sonar.JavaScript.core.fileExtensions=js,jsx,ts,tsx
sonar.typescript.tslint.configPath=.
sonar.typescript.eslint.enabled=true