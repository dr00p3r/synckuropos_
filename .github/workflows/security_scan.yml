- name: Send to Analysis API
        env:
          API_URL: ${{ secrets.ANALYSIS_API_URL }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<EOF
          import os
          import json
          import requests
          import sys

          api_url = os.environ.get("API_URL")
          files_list = os.environ.get("CHANGED_FILES", "").split()
          pr_title = os.environ.get("PR_TITLE", "Unknown PR")

          if not files_list:
              print("No relevant files changed.")
              sys.exit(0)

          # --- 1. Preparar Payload (igual que antes) ---
          code_payloads = []
          for file_path in files_list:
              try:
                  ext = os.path.splitext(file_path)[1]
                  lang_map = {".py": "python", ".js": "javascript", ".cpp": "cpp", ".java": "java"}
                  lang = lang_map.get(ext, "unknown")

                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                  code_payloads.append({
                      "filename": file_path,
                      "programming_language": lang,
                      "code": content
                  })
              except Exception as e:
                  print(f"Skipping {file_path}: {e}")

          if not code_payloads:
              sys.exit(0)

          payload = {
              "pr_title": pr_title,
              "telegram_chat_id": None, 
              "files": code_payloads
          }

          # --- 2. Enviar y Analizar Respuesta ---
          try:
              print(f"Sending {len(code_payloads)} files to {api_url}...")
              response = requests.post(f"{api_url}/analyze", json=payload, timeout=60)
              
              # Debug básico por si falla la API
              if response.status_code != 200:
                  print(f"::error::API Error {response.status_code}: {response.text}")
                  sys.exit(1)
              
              data = response.json()
              
              # Variables de control
              block_pr = False
              manual_review = False
              
              results = data.get("results", [])
              
              # --- 3. Lógica de Validación Profunda ---
              print("Analizando resultados detallados...")
              
              for res in results:
                  filename = res.get("filename", "unknown")
                  functions = res.get("functions", [])
                  
                  for func in functions:
                      fname = func.get("function_name", "unknown")
                      
                      # Extraer datos clave
                      prediction = func.get("codebert_prediction", {})
                      label = prediction.get("label", "Safe") 
                      findings = func.get("findings", []) # Lista de hallazgos extra
                      
                      # REGLA 1: Bloquear si hay findings O si el label es peligroso (distinto de Safe y Other)
                      is_dangerous = (label != "Safe" and label != "Other")
                      has_findings = (len(findings) > 0)
                      
                      if is_dangerous or has_findings:
                          print(f"::error file={filename},title=Security Vulnerability::Función '{fname}' detectada como {label} o tiene findings.")
                          block_pr = True
                          
                      # REGLA 2: Si es "Other", advertir pero NO bloquear (Petición de 'pendiente')
                      elif label == "Other":
                          print(f"::warning file={filename},title=Manual Review Needed::Función '{fname}' clasificada como 'Other'. Revisar manualmente.")
                          manual_review = True
                      
                      else:
                          print(f"OK: {filename} - {fname} -> {label}")

              # --- 4. Decisión Final ---
              if block_pr:
                  print("❌ BLOQUEANDO PR: Se encontraron vulnerabilidades críticas.")
                  sys.exit(1) # Esto pone el check en ROJO y bloquea el merge
              
              if manual_review:
                  print("⚠️ PR APROBADO CON ADVERTENCIAS: Se detectaron etiquetas 'Other'.")
                  sys.exit(0) # Esto pone el check en VERDE, pero con warnings visibles
                  
              print("✅ Security Check Passed Cleanly.")
              sys.exit(0)

          except Exception as e:
              print(f"CRITICAL ERROR executing script: {e}")
              sys.exit(1)
          EOF