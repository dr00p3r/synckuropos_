name: Security Scan (Microservice Guard)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - testing  # <--- 1. Solo se activa si el PR va dirigido a 'testing'

jobs:
  analyze_code:
    name: Analyze Code Integrity
    runs-on: ubuntu-latest
    # 2. Solo ejecuta el trabajo si la rama de origen es 'dev'
    if: github.head_ref == 'dev' 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.py
            **.js
            **.java
            **.cpp

      - name: Send to Analysis API
        env:
          API_URL: ${{ secrets.ANALYSIS_API_URL }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<EOF
          import os
          import json
          import requests
          import sys

          api_url = os.environ.get("API_URL")
          files_list = os.environ.get("CHANGED_FILES", "").split()
          pr_title = os.environ.get("PR_TITLE", "Unknown PR")

          if not files_list:
              print("No relevant files changed.")
              sys.exit(0)

          # 1. Construir la lista de objetos CodePayload
          code_payloads = []
          for file_path in files_list:
              try:
                  ext = os.path.splitext(file_path)[1]
                  lang_map = {".py": "python", ".js": "javascript", ".cpp": "cpp", ".java": "java"}
                  lang = lang_map.get(ext, "unknown")

                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                  code_payloads.append({
                      "filename": file_path,
                      "programming_language": lang,
                      "code": content
                  })
              except Exception as e:
                  print(f"Skipping {file_path}: {e}")

          if not code_payloads:
              sys.exit(0)

          # 2. Construir el AnalysisRequest
          payload = {
              "pr_title": pr_title,
              "telegram_chat_id": None, 
              "files": code_payloads
          }

          # 3. Enviar
          try:
              print(f"Sending {len(code_payloads)} files to {api_url}...")
              response = requests.post(f"{api_url}/analyze", json=payload, timeout=60)
              response.raise_for_status()
              
              data = response.json()
              print("API Response Summary:", data.get("summary_msg"))

              # 4. Bloquear PR si no es seguro
              if not data.get("is_pr_safe", True):
                  print("::error::Security Check Failed! Vulnerabilities detected.")
                  sys.exit(1)
              else:
                  print("✅ Security Check Passed.")
                  sys.exit(0)

          except Exception as e:
              print(f"CRITICAL ERROR: {e}")
              sys.exit(1)
          EOF